[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-dsp"
version = "1.0.0"
authors = [
  { name = "Emir (negg0s)" }
]
description = "Non-Euclidean Hyperbolic Waveguide & Modal Cymatics Acoustic Physics Synthesizer"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/negg0s/aether-dsp"
