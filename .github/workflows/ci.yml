name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Set up GCC / Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build Targets
        run: |
          cmake --build build --config ${{ matrix.build_type }}

      - name: Run Test Suite
        run: |
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Run Benchmark & Audio Renderer
        run: |
          ./build/aether-dsp || ./build/Release/aether-dsp.exe

  sanitizers:
    name: Memory & UB Sanitizers (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Set up GCC / Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo 'CXX=g++-13' >> 

      - name: Configure CMake with ASan & UBSan
        run: |
          cmake -B build_san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'

      - name: Build Targets
        run: |
          cmake --build build_san

      - name: Run Tests with ASan & UBSan
        run: |
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build_san --output-on-failure
